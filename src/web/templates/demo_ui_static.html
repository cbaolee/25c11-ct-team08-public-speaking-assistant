  const an = s.an, win = paceWindows(an);
  chart('#chPace', {
    kind: 'line', aria: T('report.cPace'), pts: win.map(w => ({ y: w.wpm, tip: w.label + ' · ' + Math.round(w.wpm) + ' ' + T('report.unitWpm') })), xTick: (p, i) => win[i].label,
    band: { lo: ADR.wpmLo, hi: ADR.wpmHi, label: ADR.wpmLo + '–' + ADR.wpmHi },
    table: { head: [T('chart.time'), T('report.unitWpm')], rows: win.map(w => [w.label, Math.round(w.wpm)]) }
  });
  $('#capPace').textContent = T('report.capPace');
}
function drawPause(s) {
  const an = s.an, hesN = an.pauses.filter(p => p.kind !== 'natural').length;
  $('#capPause').textContent = T('report.capPause', { n: an.pauses.length, h: hesN });
  const pc = { natural: '#8A94A6', hesitation: 'var(--warn-mark)', forgot: 'var(--bad)' };
  chart('#chPause', {
    kind: 'bar', xNum: true, xMin: 0, xMax: an.dur, barW: 8, yMin: 0, aria: T('report.cPause'), fmtY: v => v.toFixed(1),
    pts: an.pauses.map(p => ({ x: p.start, y: p.dur, color: pc[p.kind], tip: fmtTime(p.start) + ' · ' + p.dur.toFixed(1) + ' s · ' + T(p.kind === 'natural' ? 'report.pauseNatural' : p.kind === 'forgot' ? 'report.pauseForgot' : 'report.pauseHes') })),
    xTick: p => fmtTime(p.x),
    legend: [{ label: T('report.lgNatural'), color: pc.natural }, { label: T('report.lgHesitation'), color: pc.hesitation }, { label: T('report.lgForgot'), color: pc.forgot }],
    table: { head: [T('chart.time'), T('chart.value'), T('chart.type')], rows: an.pauses.map(p => [fmtTime(p.start), p.dur.toFixed(1) + ' s', T(p.kind === 'natural' ? 'report.pauseNatural' : p.kind === 'forgot' ? 'report.pauseForgot' : 'report.pauseHes')]) }
  });
}
function drawPitch(s) {
  const an = s.an, sc = s.sc, sp = an.words.filter(w => w.status !== 'missing');
  $('#capRepPitch').textContent = T('report.capPitch', { r: sc.Rst.toFixed(1) });
  chart('#chRepPitch', {
    kind: 'line', xNum: true, xMin: 0, xMax: an.dur, aria: T('report.cPitch'), endLabel: false, ref: { y: 0 }, fmtY: v => v.toFixed(0),
    pts: sp.map(w => ({ x: w.start, y: w.f0, tip: fmtTime(w.start) + ' · ' + w.f0.toFixed(1) + ' ' + T('report.unitSt') })),
    xTick: (p, i) => (i % 8 === 0 ? fmtTime(p.x) : ''),
    table: { head: [T('chart.time'), T('report.unitSt')], rows: sp.map(w => [fmtTime(w.start), w.f0.toFixed(1)]) }
  });
}
function drawVolume(s) {
  const an = s.an, sp = an.words.filter(w => w.status !== 'missing');
  const hiW = sp.reduce((m, w) => (w.vol > m.vol ? w : m)), loW = sp.reduce((m, w) => (w.vol < m.vol ? w : m));
  $('#volRead').textContent = T('report.volRead', { tHi: fmtTime(hiW.start), hi: hiW.vol.toFixed(0), tLo: fmtTime(loW.start), lo: loW.vol.toFixed(0), r: (hiW.vol - loW.vol).toFixed(0) });
  chart('#chVol', {
    kind: 'line', xNum: true, xMin: 0, xMax: an.dur, aria: T('report.cVol'), endLabel: false, fmtY: v => v.toFixed(0),
    pts: sp.map(w => ({ x: w.start, y: w.vol, tip: fmtTime(w.start) + ' · ' + w.vol.toFixed(0) + ' ' + T('report.unitDb') })),
    xTick: (p, i) => (i % 8 === 0 ? fmtTime(p.x) : ''),
    table: { head: [T('chart.time'), T('report.unitDb')], rows: sp.map(w => [fmtTime(w.start), w.vol.toFixed(0)]) }
  });
}
/* simulated playback (no real audio in the prototype) */
function stopPlayback() { if (S.play.iv) clearInterval(S.play.iv); S.play.iv = null; S.play.on = false; if ($('#playBtn')) updatePlayer(); }
function updatePlayer() {
  const s = S.cur; if (!s || !s.an) return;
  const dur = s.an.dur, t = Math.min(S.play.t, dur);
  $('#seek').max = Math.round(dur * 10); $('#seek').value = Math.round(t * 10);
  $('#seek').setAttribute('aria-valuetext', fmtTime(t) + ' / ' + fmtTime(dur));
  $('#playTime').textContent = fmtTime(t) + ' / ' + fmtTime(dur);
  $('#playBtn').innerHTML = S.play.on ? IC.pause : IC.play;
  $('#playBtn').setAttribute('aria-label', T(S.play.on ? 'common.pause' : 'common.play'));
  const cur = s.an.words.find(w => w.status !== 'missing' && w.start <= t && t < w.end);
  $$('#tx .w.now').forEach(e => e.classList.remove('now'));
  if (cur) { const el = $('#tx [data-i="' + cur.i + '"]'); if (el) { el.classList.add('now'); if (S.play.on && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' }); } }
}
function startPlayback() {
  const s = S.cur; if (!s) return;
  if (S.play.t >= s.an.dur) S.play.t = 0;
  S.play.on = true;
  S.play.iv = setInterval(() => {
    S.play.t += 0.1;
    if (S.play.t >= s.an.dur) { S.play.t = s.an.dur; stopPlayback(); }
    updatePlayer();
  }, 100);
  updatePlayer();
}
function seekTo(t, play) { stopPlayback(); S.play.t = Math.max(0, t); if (play) startPlayback(); else updatePlayer(); }
function onTxClick(e) {
  const tb = e.target.closest('.tx-time'), wb = e.target.closest('.w[data-i]');
  if (tb) { seekTo(parseFloat(tb.getAttribute('data-t0')), true); return; }
  if (wb && S.cur) seekWord(+wb.getAttribute('data-i'));
}

/* ---------- History (bottom of Home; called from RENDER.home) ---------- */
function renderHistory() {
  const ss = scored();
  $('#histBody').innerHTML = ss.slice().reverse().map(s => {
    const lab = fmtDay(s.ts) + ', ' + s.title;
    return '<tr><td>' + esc(fmtDayLong(s.ts)) + '</td><td>' + esc(s.title) + '</td><td class="num">' + fmtTime(s.dur) + '</td><td class="num">' + (s.sc.overall != null ? Math.round(s.sc.overall) : esc(T('common.na'))) + '</td><td><div class="row" style="flex-wrap:nowrap;justify-content:flex-end"><button class="btn btn-ghost btn-sm" type="button" data-open="' + s.id + '" aria-label="' + esc(T('history.open') + ': ' + lab) + '">' + esc(T('history.open')) + '</button><button class="btn btn-danger-ghost btn-sm" type="button" data-del="' + s.id + '" aria-label="' + esc(T('history.delete') + ': ' + lab) + '">' + esc(T('history.delete')) + '</button></div></td></tr>';
  }).join('');
}
function openReport(id) { const s = S.sessions.find(x => x.id === id); if (s) { S.cur = s; go('report'); } }

/* ---------- Profile ---------- */
RENDER.profile = function () {
  paintAvatar($('#avBig')); $('#avRemove').disabled = !S.avatar;
  const p = S.profile || {}, ns = T('profile.rowNotSet');
  const rows = [
    [T('profile.rowName'), S.user.name], [T('profile.rowGender'), p.gender || ns], [T('profile.rowAge'), p.age != null ? p.age : ns],
    [T('profile.rowAccent'), p.accent || ns], [T('profile.rowTopics'), p.topics && p.topics.length ? p.topics.map(k => TOPICS[k]).join(', ') : ns]
  ];
  $('#pfSummary').innerHTML = rows.map(r => '<tr><th scope="row">' + esc(r[0]) + '</th><td>' + esc(r[1]) + '</td></tr>').join('');
  renderBaseline();
};
function renderBaseline(sec, msg) {
  const rec = !!S.brec, s = sec || 0;
  $('#blTimer').textContent = fmtTime(s) + T('profile.timerSuffix', { t: fmtTime(BASELINE_SECONDS) });
  const pct = Math.min(100, Math.round(s / BASELINE_SECONDS * 100));
  $('#blBar').style.width = pct + '%'; $('#blBarWrap').setAttribute('aria-valuenow', String(pct));
  $('#blStart').innerHTML = rec ? '<span class="rec-dot" aria-hidden="true"></span>' + esc(T('profile.stop')) : esc(T(S.baseline ? 'profile.again' : 'profile.start'));
  const st = $('#blStatus');
  if (rec) { st.className = 'pill'; st.textContent = T('profile.recording'); }
  else if (msg) { st.className = 'pill warn'; st.textContent = msg; }
  else if (S.baseline) { st.className = 'pill ok'; st.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg><span></span>'; $('span', st).textContent = T('profile.saved', { date: fmtDayLong(S.baseline.ts) }); }
  else { st.className = 'pill'; st.textContent = T('profile.none'); }
}
function toggleBaseline() {
  if (S.brec) { S.brec.stop(false); return; }
  requireConsent(() => {
    S.brec = startRecorder({
      lvl: $('#blLvl'), max: BASELINE_SECONDS, onTick: s => renderBaseline(s),
      onEnd: sec => {
        S.brec = null;
        const min = Math.min(10, BASELINE_SECONDS);
        if (sec < min) { renderBaseline(0, T('profile.tooShort', { n: min })); return; }
        S.baseline = { ts: Date.now() }; renderBaseline(sec); toast(T('profile.toastSaved'));
      }
    });
    renderBaseline(0);
  });
}

/* ---------- profile modal ---------- */
function openProfileModal(first) {
  S.pmFirst = first;
  const p = S.profile || (first && PREFILL_ONBOARDING ? PREFILL : {});
  $('#mpTitle').textContent = T(first ? 'pm.titleFirst' : 'pm.titleEdit');
  $('#mpSub').textContent = T(first ? 'pm.subFirst' : 'pm.subEdit');
  $('#mpCancel').hidden = first;
  $('#mpGender').innerHTML = '<option value="">' + esc(T('pm.genderPh')) + '</option>' + T('pm.genders').map(g => '<option value="' + esc(g) + '">' + esc(g) + '</option>').join('');
  $('#mpGender').value = p.gender || '';
  $('#mpAge').value = p.age != null ? p.age : '';
  $('#mpAccents').innerHTML = T('pm.accents').map(a => '<label><input type="radio" name="pmAccent" value="' + esc(a) + '"' + (p.accent === a ? ' checked' : '') + '> ' + esc(a) + '</label>').join('');
  $('#mpTopics').innerHTML = Object.keys(TOPICS).map(k => '<label><input type="checkbox" name="pmTopic" value="' + k + '"' + (p.topics && p.topics.indexOf(k) >= 0 ? ' checked' : '') + '> ' + esc(TOPICS[k]) + '</label>').join('');
  ['eAge', 'eAccent', 'eTopics'].forEach(i => $('#' + i).classList.remove('show'));
  $('#mpAge').removeAttribute('aria-invalid');
  openModal('mProfile', { lock: first, focus: first ? '#mpGender' : undefined });
}
function saveProfileModal() {
  const age = $('#mpAge').value.trim(), acc = $('input[name=pmAccent]:checked'), tops = $$('input[name=pmTopic]:checked').map(i => i.value);
  const n = age === '' ? null : Number(age);
  const okAge = n === null || (Number.isInteger(n) && n >= 1 && n <= 120);
  $('#eAge').classList.toggle('show', !okAge); $('#mpAge').setAttribute('aria-invalid', String(!okAge));
  $('#eAccent').classList.toggle('show', !acc); $('#eTopics').classList.toggle('show', !tops.length);
  if (!okAge) { $('#mpAge').focus(); return; }
  if (!acc) { $('input[name=pmAccent]').focus(); return; }
  if (!tops.length) { $('input[name=pmTopic]').focus(); return; }
  S.profile = { gender: $('#mpGender').value || null, age: n, accent: acc.value, topics: tops };
  closeModal('mProfile'); toast(T('pm.saved')); fillTopicSelect();
  if (RENDER[S.screen]) RENDER[S.screen]();
}

/* ---------- other modals ---------- */
function openPassModal() {
  $('#mpUser').value = S.user.name; $('#mpNew').value = ''; $('#mpNew2').value = ''; clearErr($('#mpErr'));
  openModal('mPass');
}
function savePass() {
  const u = $('#mpUser').value.trim(), a = $('#mpNew').value, b = $('#mpNew2').value, err = $('#mpErr');
  if (!u || !a || !b) { showErr(err, T('pass.errEmpty')); return; }
  if (a !== b) { showErr(err, T('pass.errMismatch')); $('#mpNew2').focus(); return; }
  S.user.name = u; renderAccount(); closeModal('mPass'); toast(T('pass.ok'));
  if (RENDER[S.screen]) RENDER[S.screen]();
}
let audioTestStop = null;
function openAudioModal() {
  $('#auMic').innerHTML = T('audio.mics').map((m, i) => '<option value="' + i + '">' + esc(m) + '</option>').join('');
  $('#auTestNote').textContent = '';
  openModal('mAudio');
}
function testMic() {
  if (audioTestStop) return;
  $('#auTestNote').textContent = T('audio.testing');
  audioTestStop = levelAnim($('#auLvl'));
  setTimeout(() => { if (audioTestStop) { audioTestStop(); audioTestStop = null; $('#auTestNote').textContent = T('audio.testOk'); } }, 1800);
}

/* ---------- init / events ---------- */
function init() {
  applyText();
  document.title = T('app.name');
  $$('.mbg .box').forEach(b => { b.tabIndex = -1; });
  $('#chatTopic').innerHTML = Object.keys(TOPICS).map(k => '<option value="' + k + '">' + esc(TOPICS[k]) + '</option>').join('');

  // generic delegated clicks
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]');
    if (g) {
      closeUserMenu(); go(g.getAttribute('data-go'));
      const sc = g.getAttribute('data-scroll'), tgt = sc && document.getElementById(sc);
      if (tgt) setTimeout(() => tgt.scrollIntoView({ block: 'start' }), 0);
      return;
    }
    if (e.target.closest('[data-back]')) { go(S.from || 'home'); return; }
    const o = e.target.closest('[data-open]'); if (o) { openReport(+o.getAttribute('data-open')); return; }
    const d = e.target.closest('[data-del]');
    if (d) {
      const id = +d.getAttribute('data-del');
      confirmBox(T('history.delT'), T('history.delD'), T('history.delOk'), () => { S.sessions = S.sessions.filter(x => x.id !== id); if (S.cur && S.cur.id === id) S.cur = null; RENDER.home(); toast(T('history.deleted')); focusHeading(); });
      return;
    }
    const c = e.target.closest('[data-close]'); if (c) { const m = c.closest('.mbg'); if (m) closeModal(m.id); return; }
    if (e.target.classList && e.target.classList.contains('mbg')) { const id = e.target.id; if (!e.target._lock && id !== 'mOverlay') closeModal(id); return; }
    if (!e.target.closest('#acct')) closeUserMenu();
  });
  // keyboard: Esc, focus trap, menu arrows, tab arrows
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      const top = S.modal[S.modal.length - 1];
      if (top) { e.preventDefault(); if (top === 'mOverlay') cancelEval(); else if (!$('#' + top)._lock) closeModal(top); return; }
      if (!$('#userMenu').hidden) { closeUserMenu(true); return; }
    }
    if (e.key === 'Tab' && S.modal.length) {
      const m = $('#' + S.modal[S.modal.length - 1]), f = $$(FOCUSABLE, m).filter(usable);
      if (!f.length) { e.preventDefault(); return; }
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && (document.activeElement === first || document.activeElement === m.firstElementChild)) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      else if (!m.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    }
    const menu = $('#userMenu');
    if (!menu.hidden && menu.contains(document.activeElement)) {
      const items = $$('[role=menuitem]', menu), i = items.indexOf(document.activeElement);
      if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
      else if (e.key === 'Tab') closeUserMenu();
    }
    const tab = e.target.closest && e.target.closest('.seg [role=tab]');
    if (tab && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const tabs = $$('[role=tab]', tab.parentElement), i = tabs.indexOf(tab), nx = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
      nx.focus(); nx.click();
    }
  });

  // header / landing / auth
  $('#brandBtn').onclick = () => { if (S.user) go('home'); else { setStageAuth(false); showView('landing'); window.scrollTo(0, 0); } };
  $('#hLogin').onclick = $('#lLogin').onclick = () => openAuth('in');
  $('#hSignup').onclick = $('#lCta').onclick = () => openAuth('up');
  $('#authBack').onclick = () => { setStageAuth(false); $('#lLogin').focus({ preventScroll: true }); };
  $('#aTabIn').onclick = () => setAuthMode('in'); $('#aTabUp').onclick = () => setAuthMode('up');
  $('#authForm').addEventListener('submit', onAuthSubmit);
  $('#pwToggle').onclick = () => { const p = $('#auPass'), show = p.type === 'password'; p.type = show ? 'text' : 'password'; $('#auPass2').type = p.type; $('#pwToggle').textContent = T(show ? 'auth.hide' : 'auth.show'); $('#pwToggle').setAttribute('aria-pressed', String(show)); };
  $('#userBtn').onclick = toggleUserMenu;
  $('#userMenu').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const a = b.getAttribute('data-act'); closeUserMenu(true);
    if (a === 'profile') go('profile');
    else if (a === 'audio') openAudioModal();
    else if (a === 'perm') { $('#pmChk').checked = S.consent; openModal('mPerm'); }
    else if (a === 'pass') openPassModal();
    else if (a === 'logout') logout();
  });

  // script
  $('#attachBtn').onclick = () => $('#chatFileIn').click();
  $('#chatFileIn').onchange = e => {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    const okType = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
    if (!okType || f.size > 25 * 1024 * 1024) { showErr($('#chatErr'), T('script.errFile')); return; }
    clearErr($('#chatErr')); S.chatFile = { name: f.name, size: f.size }; renderChatFile();
  };
  $('#chatFile').addEventListener('click', e => { if (e.target.closest('#chatFileX')) { S.chatFile = null; renderChatFile(); $('#attachBtn').focus(); } });
  $('#chatSend').onclick = sendChat;
  $('#chatIn').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendChat(); } });
  $('#chatFeed').addEventListener('click', onChatAction);

  // practice
  $$('[data-src]').forEach(b => { b.onclick = () => setSrc(b.getAttribute('data-src')); });
  $('#goScript').onclick = () => go('script');
  $('#sampleBtn').onclick = pickSample;
  $('#ownText').addEventListener('input', () => { updateOwnCount(); clearErr($('#ownErr')); $('#ownText').removeAttribute('aria-invalid'); });
  $('#ownUse').onclick = useOwn;
  $('#tabRec').onclick = () => { if (S.rec) return; S.voiceTab = 'rec'; renderPractice(); };
  $('#tabUp').onclick = () => { if (S.rec) return; S.voiceTab = 'up'; renderPractice(); };
  $('#recBtn').onclick = toggleRecording;
  document.body.classList.toggle('nodemo', !SHOW_DEMO_LABELS);
  $$('#steps [data-step]').forEach(b => { b.onclick = () => goStep(+b.getAttribute('data-step')); });
  $('#recClear').onclick = () => confirmBox(T('practice.discardT'), T('practice.discardD'), T('practice.discardOk'), () => { S.audio = null; renderPractice(); $('#recBtn').focus(); });
  $('#dropBtn').onclick = () => $('#fileIn').click();
  $('#fileIn').onchange = onAudioFile;
  $('#evalBtn').onclick = runEval;
  $('#ovCancel').onclick = cancelEval;
  $('#meRetry').onclick = () => { closeModal('mError', false); runEval(); };

  // report
  $('#repAgain').onclick = () => go('practice');
  $('#tx').addEventListener('click', onTxClick);
  $('#playBtn').onclick = () => { if (S.play.on) stopPlayback(); else startPlayback(); };
  $('#seek').addEventListener('input', e => seekTo(+e.target.value / 10, false));

  // history (bottom of Home) / profile
  $('#delAll').onclick = () => confirmBox(T('history.delAllT'), T('history.delAllD'), T('history.delAllOk'), () => { S.sessions = []; S.cur = null; RENDER.home(); toast(T('history.deletedAll')); focusHeading(); });
  $('#mcfOk').onclick = () => { const cb = S.confirmCb; S.confirmCb = null; closeModal('mConfirm'); if (cb) cb(); };
  $('#editInfo').onclick = () => openProfileModal(false);
  $('#avChange').onclick = () => $('#avFile').click();
  $('#avFile').onchange = e => {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    if (!(f.type || '').startsWith('image/')) { toast(T('profile.errImage'), true); return; }
    const r = new FileReader();
    r.onload = () => { S.avatar = r.result; paintAvatar($('#avTop')); RENDER.profile(); toast(T('profile.okAvatar')); };
    r.readAsDataURL(f);
  };
  $('#avRemove').onclick = () => { S.avatar = null; paintAvatar($('#avTop')); RENDER.profile(); toast(T('profile.okRemoved')); };
  $('#blStart').onclick = toggleBaseline;

  // baseline window (after log in)
  $('#gAgree').onclick = onGateAgree;
  $('#gLogout').onclick = () => logout();

  // report: hover notes, score details
  bindTxTips();
  $('#repScoreCard').addEventListener('click', e => { const b = e.target.closest('[data-part]'); if (b) openPart(b.getAttribute('data-part')); });
  $('#mpartBody').addEventListener('click', e => {
    const c = e.target.closest('[data-wi]'); if (!c || !S.cur) return;
    const i = +c.getAttribute('data-wi');
    closeModal('mPart', false);
    seekWord(i);
    const el = $('#tx [data-i="' + i + '"]');
    if (el) { el.scrollIntoView({ block: 'center' }); if (el.focus) el.focus({ preventScroll: true }); }
  });

  // modals
  $('#mpSave').onclick = saveProfileModal;
  $('#mpCancel').onclick = () => closeModal('mProfile');
  $('#mcAllow').onclick = () => { S.consent = true; S.onDeny = null; closeModal('mConsent'); toast(T('consent.toastOn')); const cb = S.afterConsent; S.afterConsent = null; if (cb) cb(); };
  $('#mcDeny').onclick = () => { S.afterConsent = null; const cb = S.onDeny; S.onDeny = null; closeModal('mConsent'); if (cb) cb(); else toast(T('consent.toastDenied')); };
  $('#passSave').onclick = savePass;
  $('#auIn').addEventListener('input', e => { $('#auInV').textContent = e.target.value; });
  $('#auOut').addEventListener('input', e => { $('#auOutV').textContent = e.target.value; });
  $('#auTest').onclick = testMic;
  $('#audioSave').onclick = () => { closeModal('mAudio'); toast(T('audio.ok')); };
  $('#permSave').onclick = () => { S.consent = $('#pmChk').checked; closeModal('mPerm'); toast(T(S.consent ? 'consent.toastOn' : 'consent.toastOff')); };

  window.addEventListener('resize', () => { syncHeader(); syncStage(); });
  window.addEventListener('scroll', syncHero, { passive: true });
  if (window.ResizeObserver) new ResizeObserver(syncStage).observe($('#lStage'));
  showView('landing'); renderAccount();
}
init();
