<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
<title>Public Speaking Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   DESIGN TOKENS  (single source of truth: map these 1:1 to tailwind.config)
   Concept: "annotated manuscript" - a calm light page; marks are the loud part.
   Serif = the voice of the speech (titles, scripts, transcript).
   Sans  = the voice of the system (controls, numbers, charts).
   ===================================================================== */
:root {
  --paper: #F7F8FA;        /* page */
  --surface: #FFFFFF;      /* panels, sheets */
  --ink: #1B2433;          /* primary text */
  --muted: #5B6475;        /* secondary text (>= 5:1 on paper) */
  --line: #E3E7EE;         /* hairlines */
  --line-strong: #C9D0DB;  /* control borders, neutral marks */

  --accent: #1D4ED8;       /* primary action, links, focus, data */
  --accent-hover: #1E40AF;
  --accent-soft: #EAF0FE;
  --accent-line: #BBD0FB;

  --record: #DC2626;       /* recording only */
  --record-hover: #B91C1C;

  /* feedback colors: text tokens are >= 4.5:1 on their soft background */
  --ok: #047857;   --ok-soft: #D1FAE5;
  --warn: #92400E; --warn-soft: #FEF3C7;
  --bad: #B91C1C;  --bad-soft: #FEE2E2;
  --warn-mark: #D97706;    /* strokes/bars only, never text */

  --serif: "EB Garamond", Garamond, Georgia, serif;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --r-ctl: 10px;           /* controls */
  --r-panel: 14px;         /* panels, sheets, modals */
  --r-pill: 999px;         /* chips, pills */
  --shadow-pop: 0 12px 32px rgba(27, 36, 51, .14);   /* only for things that float */
  --hh: 64px;              /* header height, synced by JS */
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.55 var(--sans); min-height: 100vh; }
img, svg { max-width: 100%; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1[tabindex="-1"]:focus, .box:focus { outline: none; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 12px; top: -48px; background: var(--ink); color: #fff; padding: 10px 14px; border-radius: var(--r-ctl); z-index: 300; text-decoration: none; }
.skip:focus { top: 12px; }

/* ---------- type ---------- */
h1, h2 { font-family: var(--serif); font-weight: 600; color: var(--ink); letter-spacing: -.005em; margin: 0; }
h1 { font-size: clamp(30px, 4vw, 40px); line-height: 1.12; }
h2 { font-size: 26px; line-height: 1.2; }
h3 { font: 600 15px/1.3 var(--sans); margin: 0; color: var(--ink); }
p { margin: 0; }
.sub { color: var(--muted); font-size: 16px; margin-top: 6px; max-width: 62ch; }
.note { font-size: 14px; color: var(--muted); }
.mute { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 9px 16px; border-radius: var(--r-ctl); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font: 600 15px/1.2 var(--sans); cursor: pointer; transition: background .15s, border-color .15s; text-decoration: none; }
.btn:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--accent-line); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-record { background: var(--record); border-color: var(--record); color: #fff; }
.btn-record:hover:not(:disabled) { background: var(--record-hover); border-color: var(--record-hover); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn-ghost:hover:not(:disabled) { background: var(--accent-soft); border-color: transparent; }
.btn-danger-ghost { border-color: transparent; background: transparent; color: var(--bad); }
.btn-danger-ghost:hover:not(:disabled) { background: var(--bad-soft); border-color: transparent; }
.btn-sm { min-height: 34px; padding: 5px 12px; font-size: 14px; }
.btn-lg { min-height: 50px; padding: 12px 24px; font-size: 17px; }
.btn svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.iconbtn { width: 42px; height: 42px; padding: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.row.end { justify-content: flex-end; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font: 600 15px var(--sans); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- header ---------- */
header.top { position: sticky; top: 0; z-index: 50; background: var(--surface); border-bottom: 1px solid var(--line); transition: background .2s, border-color .2s; }
/* landing: the header sits on top of the photo (negative margin pulls the stage under it); it turns solid once the page scrolls */
body.landing-view header.top { margin-bottom: calc(var(--hh) * -1); }
header.top.hero { background: transparent; border-bottom-color: transparent; }
header.top.hero .brand { color: #fff; }
header.top.hero .btn:not(.btn-primary) { background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .55); color: #fff; }
header.top.hero .btn:not(.btn-primary):hover { background: rgba(255, 255, 255, .16); border-color: #fff; }
header.top.hero .btn-primary { box-shadow: 0 0 0 1px rgba(255, 255, 255, .3); }
header.top.hero :focus-visible { outline-color: #fff; }
.top-in { max-width: 1120px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px; cursor: pointer; font: 600 22px/1 var(--serif); color: var(--ink); }
.brand .lk { height: 36px; width: auto; display: block; flex: none; }
.brand .lk-dark { display: none; }
header.top.hero .brand .lk-light { display: none; }
header.top.hero .brand .lk-dark { display: block; }
.nav { display: flex; gap: 2px; margin-left: 16px; }
.nav button { background: none; border: 0; border-bottom: 3px solid transparent; border-radius: 0; padding: 14px 12px 11px; font: 600 15px/1 var(--sans); color: var(--muted); cursor: pointer; }
.nav button:hover { color: var(--ink); }
.nav button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.acct { margin-left: auto; display: flex; align-items: center; gap: 8px; position: relative; }
.userbtn { display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 4px 12px 4px 4px; border-radius: var(--r-pill); border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font: 600 15px var(--sans); color: var(--ink); }
.userbtn:hover { background: var(--accent-soft); border-color: var(--accent-line); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; font: 600 15px var(--sans); overflow: hidden; flex: none; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.xl { width: 88px; height: 88px; font-size: 34px; }
.menu { position: absolute; right: 0; top: calc(100% + 8px); min-width: 250px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-panel); box-shadow: var(--shadow-pop); padding: 6px; z-index: 60; }
.menu button { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 10px 12px; font: 500 15px var(--sans); color: var(--ink); cursor: pointer; }
.menu button:hover, .menu button:focus-visible { background: var(--accent-soft); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
@media (max-width: 720px) {
  .top-in { padding: 8px 16px; gap: 6px; }
  .nav { order: 3; width: 100%; margin-left: 0; overflow-x: auto; }
  .nav button { flex: 1; padding: 10px 8px 9px; }
  .userbtn .uname { display: none; }
  .userbtn { padding: 4px; }
  .brand .lk { height: 30px; }
}

/* ---------- layout ---------- */
main { max-width: 1120px; margin: 0 auto; padding: 28px 24px 72px; }
@media (max-width: 720px) { main { padding: 20px 16px 56px; } }
.screen { display: none; }
.screen.active { display: block; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.back { margin-bottom: 10px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-panel); padding: 20px; }
.panel > h3 + * { margin-top: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }
@media (max-width: 860px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.badge-demo { display: inline-flex; align-items: center; gap: 6px; font: 600 12px var(--sans); padding: 3px 10px; border-radius: var(--r-pill); background: var(--warn-soft); color: var(--warn); }

/* ---------- pills / status ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; font: 600 13px/1.3 var(--sans); padding: 3px 10px; border-radius: var(--r-pill); background: var(--line); color: var(--ink); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.pill svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- forms ---------- */
label, .lbl { display: block; font: 600 14px var(--sans); margin: 16px 0 6px; color: var(--ink); }
label small, .lbl small { font-weight: 400; color: var(--muted); }
input[type=text], input[type=password], input[type=number], select, textarea { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); font: 400 16px var(--sans); background: var(--surface); color: var(--ink); }
textarea { resize: vertical; line-height: 1.5; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent-line); outline-offset: 0; border-color: var(--accent); }
input[aria-invalid="true"], select[aria-invalid="true"] { border-color: var(--bad); background: #FFF7F7; }
.ferr { color: var(--bad); font-size: 14px; margin-top: 6px; display: none; }
.ferr.show { display: block; }
.opts { display: flex; gap: 8px; flex-wrap: wrap; }
.opts label { margin: 0; display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 8px 14px; border: 1px solid var(--line-strong); border-radius: var(--r-pill); font: 500 15px var(--sans); cursor: pointer; background: var(--surface); }
.opts label:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.opts input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
input[type=range] { width: 100%; accent-color: var(--accent); min-height: 28px; padding: 0; }
.switch { display: flex; gap: 14px; align-items: flex-start; padding: 14px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--accent-soft); margin-top: 14px; }
.switch input { width: 22px; height: 22px; accent-color: var(--accent); margin-top: 2px; }
.switch label { margin: 0; }
.pwwrap { position: relative; }
.pwwrap input { padding-right: 74px; }
.pwwrap button { position: absolute; right: 6px; top: 6px; }

/* ---------- segmented tabs ---------- */
.seg { display: inline-flex; padding: 3px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-ctl); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 8px; font: 600 14px var(--sans); color: var(--muted); cursor: pointer; min-height: 36px; }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line-strong); }

/* ---------- stepper (a real sequence, so numbered) ---------- */
.steps { list-style: none; display: flex; gap: 8px; padding: 0; margin: 0 0 24px; flex-wrap: wrap; }
.steps li { display: flex; align-items: center; gap: 10px; font: 600 14px var(--sans); color: var(--muted); padding: 6px 14px 6px 6px; border: 1px solid var(--line); border-radius: var(--r-pill); background: var(--surface); }
.steps .n { width: 26px; height: 26px; border-radius: 50%; background: var(--line); color: var(--muted); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; }
.steps li.done { color: var(--ok); }
.steps li.done .n { background: var(--ok-soft); color: var(--ok); }
.steps li.cur { color: var(--ink); border-color: var(--accent); }
.steps li.cur .n { background: var(--accent); color: #fff; }

/* ---------- teleprompter sheet ---------- */
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-panel); padding: 24px 28px; font: 400 clamp(22px, 2.4vw, 28px)/1.62 var(--serif); min-height: 200px; max-height: 50vh; overflow: auto; }
.sheet.empty { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 12px; font: 400 16px/1.5 var(--sans); color: var(--muted); }
.sheet-title { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 8px; flex-wrap: wrap; }

/* ---------- recorder ---------- */
.timer { font: 600 44px/1 var(--sans); font-variant-numeric: tabular-nums; margin: 6px 0 14px; letter-spacing: -.01em; }
.lvl { display: flex; align-items: flex-end; gap: 4px; height: 36px; margin: 0 0 14px; }
.lvl i { flex: 1; max-width: 14px; height: 4px; border-radius: 3px; background: var(--line-strong); transition: height .1s; }
.lvl.live i { background: var(--accent); }
.rec-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--record); margin-right: 8px; animation: blink 1.1s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.drop { border: 2px dashed var(--accent-line); border-radius: var(--r-panel); padding: 30px 20px; text-align: center; color: var(--muted); background: var(--accent-soft); cursor: pointer; width: 100%; font: 500 15px var(--sans); }
.drop:hover { border-color: var(--accent); }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 4px; }

/* ---------- chat (Generate Script) ---------- */
.chat { display: flex; flex-direction: column; gap: 14px; height: min(520px, 62vh); overflow-y: auto; padding: 4px 2px 12px; }
.bubble { max-width: min(680px, 92%); padding: 14px 16px; border-radius: var(--r-panel); border: 1px solid var(--line); background: var(--surface); line-height: 1.6; font-size: 16px; }
.bubble.me { align-self: flex-end; background: var(--accent-soft); border-color: var(--accent-line); white-space: pre-wrap; }
.bubble.ai { align-self: flex-start; }
.bubble .who { display: flex; align-items: center; gap: 8px; font: 600 13px var(--sans); color: var(--muted); margin-bottom: 8px; }
.bubble .who svg, .bubble .who img { width: 18px; height: 18px; }
.bubble .para { font: 400 20px/1.6 var(--serif); }
.bubble .para + .para { margin-top: 10px; }
.bubble .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.cite { font: 600 12px var(--sans); background: var(--accent-soft); color: var(--accent); padding: 2px 8px; border-radius: var(--r-pill); margin-left: 6px; white-space: nowrap; vertical-align: 2px; }
.cite.un { background: var(--warn-soft); color: var(--warn); }
.skel { height: 12px; border-radius: 6px; margin: 10px 0; background: linear-gradient(90deg, #EEF1F5 25%, #E3E7EE 50%, #EEF1F5 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.composer { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 4px; }
.composer .row { align-items: flex-end; }
.composer textarea { min-height: 72px; flex: 1; min-width: 200px; resize: none; }
.fchip { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-pill); padding: 3px 4px 3px 12px; font: 500 14px var(--sans); margin-bottom: 10px; }

/* ---------- report ---------- */
.rep { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
.rep-aside { position: sticky; top: calc(var(--hh) + 16px); display: flex; flex-direction: column; gap: 16px; }
@media (max-width: 960px) { .rep { grid-template-columns: minmax(0, 1fr); } .rep-aside { position: static; order: -1; } }
.hero-score { display: flex; align-items: baseline; gap: 8px; }
.hero-score b { font: 700 64px/1 var(--sans); letter-spacing: -.02em; }
.hero-score span { font: 500 20px var(--sans); color: var(--muted); }
.parts { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.parts li .top { display: flex; justify-content: space-between; font: 600 14px var(--sans); }
.parts li .top span:last-child { font-variant-numeric: tabular-nums; }
.parts .bar { margin-top: 6px; }
.parts small { color: var(--muted); font: 400 13px var(--sans); }
details.more { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
details.more summary { cursor: pointer; font: 600 14px var(--sans); color: var(--accent); }
.kv { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
.kv th, .kv td { text-align: left; padding: 6px 0; border-bottom: 1px solid var(--line); font-weight: 400; vertical-align: top; }
.kv td { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.todo { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.todo li { padding-left: 14px; border-left: 3px solid var(--warn-mark); }
.todo li b { display: block; font: 600 14px var(--sans); }
.todo li span { font-size: 14px; color: var(--muted); }
.tx { margin-top: 10px; }
.tx-row { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 14px; padding: 4px 0; }
.tx-time { background: none; border: 0; padding: 0.6em 0 0; font: 500 13px var(--sans); color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; cursor: pointer; align-self: start; }
.tx-time:hover { color: var(--accent); }
.tx-text { font: 400 clamp(20px, 2.2vw, 24px)/1.9 var(--serif); }
.w { border-radius: 3px; padding: 0 1px; }
button.w { font: inherit; color: inherit; background: none; border: 0; padding: 0 2px; cursor: pointer; }
.w-wrong { background: var(--bad-soft) !important; text-decoration: underline wavy var(--bad); text-decoration-thickness: 1.5px; text-underline-offset: 5px; }
.w-near { background: var(--warn-soft) !important; text-decoration: underline dotted var(--warn-mark); text-decoration-thickness: 2px; text-underline-offset: 5px; }
.w-missing { background: var(--bad-soft) !important; color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.w.now { outline: 2px solid var(--accent); outline-offset: 1px; background: var(--accent-soft); }
.pausechip, .fillerchip { display: inline-block; font: 600 12px/1.5 var(--sans); padding: 0 8px; border-radius: var(--r-pill); margin: 0 4px; vertical-align: 3px; }
.pausechip.warn { background: var(--warn-soft); color: var(--warn); }
.pausechip.bad { background: var(--bad-soft); color: var(--bad); }
.fillerchip { background: var(--accent-soft); color: var(--accent); font-style: italic; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); font: 500 13px var(--sans); color: var(--muted); }
.legend .k { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; }
.detail { margin-top: 12px; min-height: 22px; font-size: 14px; color: var(--muted); }
.player { position: sticky; bottom: 12px; z-index: 20; margin-top: 18px; display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-panel); box-shadow: var(--shadow-pop); padding: 8px 14px; }
.player input[type=range] { flex: 1; }
.player .t { font: 600 13px var(--sans); font-variant-numeric: tabular-nums; color: var(--muted); min-width: 86px; text-align: right; }
.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
@media (max-width: 720px) { .charts { grid-template-columns: minmax(0, 1fr); } }
.state { text-align: left; padding: 28px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.state h2 { font-size: 24px; }

/* ---------- charts ---------- */
.chartbox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-panel); padding: 16px 16px 12px; min-width: 0; }
.chartbox .cap { font: 400 14px var(--sans); color: var(--muted); margin: 4px 0 10px; }
.chart { width: 100%; min-height: 180px; }
.chart svg { display: block; overflow: visible; }
.chart text { font: 500 12px var(--sans); fill: var(--muted); }
.chart .ax text { font-variant-numeric: tabular-nums; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .mk { cursor: default; }
.chart .hit { fill: transparent; }
.chart .band { fill: var(--accent-soft); }
.chart .band-l { fill: var(--accent); font-weight: 600; }
.chart .ref { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 4; }
.chartbox details { margin-top: 8px; }
.chartbox summary { font: 600 13px var(--sans); color: var(--accent); cursor: pointer; }
.chartbox table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
.chartbox th, .chartbox td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); font-weight: 400; font-variant-numeric: tabular-nums; }
.clegend { display: flex; gap: 14px; flex-wrap: wrap; font: 500 13px var(--sans); color: var(--muted); margin-top: 6px; }
.clegend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
#tip { position: fixed; z-index: 400; pointer-events: none; background: var(--ink); color: #fff; font: 500 13px/1.35 var(--sans); padding: 6px 10px; border-radius: 8px; max-width: 260px; display: none; }

/* ---------- home ---------- */
.next { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; margin: 24px 0; }
@media (max-width: 860px) { .next { grid-template-columns: minmax(0, 1fr); } }
.next .go { background: var(--accent-soft); border-color: var(--accent-line); }
.next .go h2 { font-size: 24px; margin-top: 4px; }
.next .go p { margin-top: 8px; max-width: 54ch; }
.bigscore { display: flex; align-items: baseline; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.bigscore b { font: 700 56px/1 var(--sans); letter-spacing: -.02em; }
.chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
@media (max-width: 400px) { .chart-grid { grid-template-columns: minmax(0, 1fr); } }
.empty { text-align: left; padding: 28px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }

/* ---------- history table ---------- */
.tablewrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; min-width: 560px; }
table.t th, table.t td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--line); font-size: 15px; }
table.t th { font: 600 13px var(--sans); color: var(--muted); }
table.t td.num { font-variant-numeric: tabular-nums; }
table.t tr:last-child td { border-bottom: 0; }

/* ---------- profile ---------- */
.kvt { width: 100%; border-collapse: collapse; }
.kvt th, .kvt td { text-align: left; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; vertical-align: top; }
.kvt th { font-weight: 600; color: var(--muted); width: 38%; }
.who-row { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }

/* ---------- modals ---------- */
.mbg { position: fixed; inset: 0; background: rgba(27, 36, 51, .45); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
.mbg.show { display: flex; }
.box { background: var(--surface); border-radius: var(--r-panel); width: 100%; max-width: 480px; max-height: 92vh; overflow: auto; padding: 24px 26px; box-shadow: var(--shadow-pop); }
.box h2 { font-size: 24px; margin-bottom: 6px; }
.box.center { text-align: center; }
.box.center .row { justify-content: center; }
.box .actions { margin-top: 22px; display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.spinner { width: 34px; height: 34px; border: 4px solid var(--line); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 14px; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

#toast { position: fixed; bottom: 24px; right: 24px; left: 24px; margin-left: auto; max-width: 400px; display: none; align-items: flex-start; gap: 10px; background: var(--ink); color: #fff; padding: 12px 16px; border-radius: var(--r-ctl); box-shadow: var(--shadow-pop); z-index: 200; font: 500 15px/1.45 var(--sans); border-left: 5px solid var(--ok-soft); }
#toast.show { display: flex; }
#toast.err { border-left-color: #FCA5A5; }
#toast svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; margin-top: 1px; }

/* ---------- landing ---------- */
/* Stage = full-bleed photo. Inline copy so this file runs on its own; in the FastAPI app use
   url("/static/img/background.jpg") instead (file: src/web/static/img/background.jpg). */
.l-stage { --stage-img: url("/static/img/background.png"); position: relative; background-color: #05070D; color: #fff; overflow: hidden;
  background-image: linear-gradient(to bottom, rgba(5, 7, 13, .62) 0, rgba(5, 7, 13, 0) 150px), linear-gradient(90deg, rgba(5, 7, 13, 0) 0%, rgba(5, 7, 13, .30) 50%, rgba(5, 7, 13, .62) 100%), var(--stage-img);
  background-repeat: no-repeat; background-size: auto, auto, cover; background-position: 0 0, 0 0, left center; }
.l-stage-in { max-width: 1120px; margin: 0 auto; padding: 120px 24px 112px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.l-copy { grid-column: 2; }
.l-stage h1 { color: #fff; font-size: clamp(38px, 5vw, 58px); line-height: 1.06; max-width: 14ch; }
.l-stage p.lead { font: 400 21px/1.5 var(--serif); color: #E6EAF1; margin: 20px 0 28px; max-width: 34ch; }
.l-stage .cta { display: flex; gap: 12px; flex-wrap: wrap; }
.l-stage .note { color: #C9D0DB; }
.l-stage .btn-primary { box-shadow: 0 0 0 1px rgba(255, 255, 255, .3); }
.l-stage .btn:not(.btn-primary) { background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .55); color: #fff; }
.l-stage .btn:not(.btn-primary):hover { background: rgba(255, 255, 255, .16); border-color: #fff; }
.l-stage :focus-visible { outline-color: #fff; }
.landing { max-width: 1120px; margin: 0 auto; padding: 48px 24px 72px; }
@media (max-width: 900px) {
  .l-stage { background-image: linear-gradient(to bottom, rgba(5, 7, 13, .62) 0, rgba(5, 7, 13, 0) 130px), linear-gradient(to bottom, rgba(5, 7, 13, 0) 240px, #05070D 440px), var(--stage-img);
    background-size: auto, auto, auto 440px; background-position: 0 0, 0 0, 18% top; }
  .l-stage-in { grid-template-columns: minmax(0, 1fr); padding: 300px 16px 72px; }
  .l-copy { grid-column: 1; }
  .landing { padding: 32px 16px 56px; }
}
.sample { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-panel); padding: 24px 28px; box-shadow: var(--shadow-pop);
  display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 6px 40px; align-items: center; }
.sample > p, .sample > figcaption { grid-column: 1 / -1; }
.sample .tx-text { font-size: 22px; line-height: 1.95; }
.sample .mini { display: grid; grid-template-columns: repeat(3, auto); justify-content: space-between; gap: 14px; margin: 0; padding: 0 0 0 32px; border-left: 1px solid var(--line); }
.sample .mini div { font: 400 13px var(--sans); color: var(--muted); }
.sample .mini b { display: block; font: 700 22px/1.2 var(--sans); color: var(--ink); }
@media (max-width: 800px) {
  .landing { padding-top: 32px; }
  .sample { grid-template-columns: minmax(0, 1fr); padding: 20px; }
  .sample .mini { display: flex; flex-wrap: wrap; gap: 8px 22px; padding: 14px 0 0; margin-top: 8px; border-left: 0; border-top: 1px solid var(--line); }
}
.how { margin-top: 56px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; list-style: none; padding: 0; }
@media (max-width: 800px) { .how { grid-template-columns: minmax(0, 1fr); margin-top: 40px; } }
.how li { border-top: 2px solid var(--ink); padding-top: 14px; }
.how li .n { font: 600 14px var(--sans); color: var(--accent); }
.how li h3 { font: 600 22px/1.2 var(--serif); margin: 4px 0 6px; }
.how li p { color: var(--muted); font-size: 15px; }

/* ---------- auth ---------- */
.authwrap { min-height: calc(100vh - var(--hh)); display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.authbox { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-panel); padding: 28px; box-shadow: var(--shadow-pop); }
.authbox h2 { margin: 6px 0 2px; }

@media (prefers-reduced-motion: reduce) {
  *:not(.spinner), *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
@media (forced-colors: active) {
  .w-wrong, .w-near, .w-missing { forced-color-adjust: none; }
  .btn-primary, .btn-record { border: 2px solid ButtonText; }
}
</style>
</head>

/* =====================================================================
   SAMPLE-DATA ENGINE + SCORING (ADR-003)
   simulate()  -> invents a plausible "take" (word timings, pauses, F0) for the DEMO ONLY.
   score()     -> pure, deterministic implementation of the ADR-003 formulas.
   In the real app, simulate() is replaced by STT word timestamps + Silero VAD + Parselmouth,
   and score() is the function the QA lead unit-tests.
   ===================================================================== */
const ADR = {
  wpmLo: 130, wpmHi: 160, wpmPenalty: 2.5,
  pauseMin: 0.25, hesMin: 0.5, forgotMin: 1.2,
  fillerFull: 2, fillerZero: 10, fillerWarn: 4,
  nearWeight: 5, pitchFull: 6, pitchZero: 2, monotone: 4,
  cosine: 0.82, minVoiced: 0.30,
  weights: { A: 0.40, F: 0.30, P: 0.20, S: 0.10 },
  minSessionsForDelta: 6
};
const clamp = (x, lo = 0, hi = 100) => Math.min(hi, Math.max(lo, x));
const mean = a => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0);
function pct(arr, p) {
  const s = [...arr].sort((a, b) => a - b);
  if (!s.length) return 0;
  const i = (s.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i);
  return s[lo] + (s[hi] - s[lo]) * (i - lo);
}
function rng(seed) {                         // mulberry32
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function tokenize(text) {
  const sentences = (text.match(/[^.!?]+[.!?]*["')]*\s*/g) || [text]).map(s => s.trim()).filter(Boolean);
  const words = [];
  sentences.forEach((s, si) => {
    const parts = s.split(/\s+/).filter(Boolean);
    parts.forEach((raw, wi) => words.push({
      raw, norm: raw.toLowerCase().replace(/[^a-z0-9']/g, ''), si,
      last: wi === parts.length - 1,
      endSent: /[.!?]["')]*$/.test(raw), endClause: /[,;:]$/.test(raw)
    }));
  });
  return { sentences, words };
}

function simulate(text, lvl, seed) {
  const rnd = rng(seed);
  const { sentences, words } = tokenize(text);
  let t = 0.5;
  const pauses = [], fillers = [];
  let spokenCount = 0, voiced = 0;
  words.forEach((w, i) => {
    w.i = i;
    const roll = rnd(), r1 = rnd(), r2 = rnd(), r3 = rnd();
    let status = 'ok';
    if (w.norm.length > 3) {
      if (roll < lvl.miss) status = 'missing';
      else if (roll < lvl.miss + lvl.wrong) status = 'wrong';
      else if (roll < lvl.miss + lvl.wrong + lvl.near) status = 'near';
    }
    w.status = status;
    if (status === 'missing') { w.start = w.end = null; return; }
    const d = (60 / lvl.wpm) * 0.8 * (0.7 + 0.6 * r1) * (0.85 + Math.min(w.norm.length, 10) * 0.03);
    w.start = t; w.end = t + d; t = w.end; voiced += d;
    const k = spokenCount++;
    w.f0 = lvl.pitch * (0.55 * Math.sin(k * 0.7 + (seed % 7)) + 0.8 * (r3 - 0.5)) - (w.endSent ? lvl.pitch * 0.25 : 0);
    w.vol = 62 + 3 * Math.sin(k * 0.4) + 4 * (r2 - 0.5) - (w.endSent ? 2 : 0);
    if (i < words.length - 1) {
      let gap = 0.01 + 0.04 * r2, kind = null;
      if (w.endSent) { gap = 0.5 + 0.4 * r1; kind = 'natural'; }
      else if (w.endClause) { gap = 0.3 + 0.25 * r1; kind = 'natural'; }
      else if (r3 < lvl.hes) { gap = 0.5 + 0.9 * r1; kind = gap >= ADR.forgotMin ? 'forgot' : 'hesitation'; }
      if (gap >= ADR.pauseMin) {
        w.pauseAfter = { start: t, dur: gap, kind: kind || 'natural', afterIdx: i };
        pauses.push(w.pauseAfter);
      }
      t += gap;
      if (rnd() < lvl.filler) { fillers.push({ afterIdx: i, t }); w.fillerAfter = true; t += 0.32; voiced += 0.3; }
    }
  });
  const dur = t + 0.4;
  const cos = sentences.map((_, si) => {
    const ws = words.filter(w => w.si === si);
    const err = ws.filter(w => w.status === 'wrong' || w.status === 'missing').length / Math.max(1, ws.length);
    return clamp(0.97 - 1.6 * err + 0.04 * (rnd() - 0.5), 0, 1);
  });
  return { text, sentences, words, pauses, fillers, cos, dur, voicedRatio: voiced / dur };
}

function score(an) {
  const N = an.words.length;
  const spoken = an.words.filter(w => w.status !== 'missing');
  if (an.voicedRatio < ADR.minVoiced || spoken.length === 0) return { status: 'insufficient_audio', voicedRatio: an.voicedRatio };
  const sub = an.words.filter(w => w.status === 'wrong').length;
  const del = an.words.filter(w => w.status === 'missing').length;
  const near = an.words.filter(w => w.status === 'near').length;
  const A = clamp(100 * (1 - (sub + del) / N));                              // fillers are not insertions here (counted in F)
  const span = spoken[spoken.length - 1].end - spoken[0].start;
  const wpm = spoken.length / (span / 60);
  const Fwpm = (wpm >= ADR.wpmLo && wpm <= ADR.wpmHi) ? 100 : clamp(100 - ADR.wpmPenalty * (wpm < ADR.wpmLo ? ADR.wpmLo - wpm : wpm - ADR.wpmHi));
  const hes = an.pauses.filter(p => p.kind !== 'natural').length;
  const H = hes / (an.dur / 60);
  const Fpause = clamp(100 - 20 * Math.max(0, H - 1));
  const R = 100 * an.fillers.length / (spoken.length + an.fillers.length);
  const Ffiller = clamp(100 * (ADR.fillerZero - R) / (ADR.fillerZero - ADR.fillerFull));
  const F = mean([Fwpm, Fpause, Ffiller]);
  const Pclar = clamp(100 * (1 - ADR.nearWeight * near / N));               // near-miss is not an error in A (counted here)
  const f0 = spoken.map(w => w.f0);
  const Rst = pct(f0, 0.9) - pct(f0, 0.1);
  const Ppitch = Rst >= ADR.pitchFull ? 100 : Rst <= ADR.pitchZero ? 0 : 25 * (Rst - ADR.pitchZero);
  const P = 0.5 * Pclar + 0.5 * Ppitch;
  const cosOk = an.cos.filter(c => c >= ADR.cosine).length;
  const S = 100 * cosOk / an.cos.length;
  const parts = [A, F, P, S];
  const overall = parts.every(Number.isFinite) ? ADR.weights.A * A + ADR.weights.F * F + ADR.weights.P * P + ADR.weights.S * S : null;
  return { status: 'ok', N, sub, del, near, A, wpm, Fwpm, hes, H, Fpause, R, Ffiller, F, Pclar, Rst, Ppitch, P, cosOk, nSent: an.cos.length, S, overall };
}

/* Next-step advice: deterministic templates over the lowest sub-scores (the LLM never grades). */
function adviceList(sc, limit, below) {
  const items = [
    { key: 'wpm', v: sc.Fwpm, area: 'areaWpm', val: Math.round(sc.wpm) },
    { key: 'pause', v: sc.Fpause, area: 'areaPause', val: sc.H.toFixed(1) },
    { key: 'filler', v: sc.Ffiller, area: 'areaFiller', val: sc.R.toFixed(1) },
    { key: 'accuracy', v: sc.A, area: 'areaAccuracy', val: sc.sub + sc.del },
    { key: 'clarity', v: sc.Pclar, area: 'areaClarity', val: sc.near },
    { key: 'pitch', v: sc.Ppitch, area: 'areaPitch', val: sc.Rst.toFixed(1) },
    { key: 'semantic', v: sc.S, area: 'areaSemantic', val: sc.nSent - sc.cosOk }
  ];
  return items.filter(x => x.v < (below == null ? 85 : below)).sort((a, b) => a.v - b.v).slice(0, limit)
    .map(x => ({ key: x.key, v: x.v, area: T('report.' + x.area), text: T('report.adv_' + x.key, { v: x.val }) }));
}

/* Progress (ADR-003): mean of the last 3 scored sessions minus the 3 before; needs >= 6. */
function progressDelta(sessions) {
  const sc = sessions.filter(s => s.sc.status === 'ok').sort((a, b) => a.ts - b.ts).map(s => s.sc.overall);
  if (sc.length < ADR.minSessionsForDelta) return { d: null, n: sc.length };
  return { d: mean(sc.slice(-3)) - mean(sc.slice(-6, -3)), n: sc.length };
}

function paceWindows(an) {
  const dur = an.dur, SZ = 5, nWin = Math.max(1, Math.floor(dur / SZ));
  const out = [];
  for (let k = 0; k < nWin; k++) {
    const ws = k * SZ, we = k === nWin - 1 ? dur : ws + SZ;
    const count = an.words.filter(w => w.status !== 'missing' && w.start >= ws && w.start < we).length;
    out.push({ label: Math.round(ws) + '-' + Math.round(we) + 's', wpm: count / ((we - ws) / 60) });
  }
  return out;
}

/* =====================================================================
   CHARTS  (self-drawn responsive SVG; swap for Chart.js later if the team wants)
   Rules followed: thin marks, 2px lines, r=4 markers with a 2px surface ring, solid hairline grid,
   dashed only for threshold lines, selective labels (last value only), tooltip per mark,
   a "View as table" alternative for every chart, text never wears the series colour.
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtTime = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

function niceTicks(lo, hi, n) {
  n = n || 4;
  const span = (hi - lo) || 1, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
  const a = Math.floor(lo / step + 1e-9) * step, b = Math.ceil(hi / step - 1e-9) * step;
  const ticks = [];
  for (let v = a; v <= b + step / 2; v += step) ticks.push(+v.toFixed(6));
  return { ticks, lo: a, hi: b };
}

/* ---- tooltip ---- */
function showTip(text, cx, cy) {
  const t = $('#tip');
  if (!t) return;
  t.textContent = text;
  t.style.display = 'block';
  const w = t.offsetWidth || 120, h = t.offsetHeight || 30;
  let x = cx + 14, y = cy - h - 10;
  if (x + w > window.innerWidth - 8) x = cx - w - 14;
  if (y < 8) y = cy + 16;
  t.style.left = Math.max(8, x) + 'px';
  t.style.top = y + 'px';
}
function hideTip() { const t = $('#tip'); if (t) t.style.display = 'none'; }

/* ---- main renderer ----
   spec = { kind:'line'|'bar', pts:[{x,y,tip,color}], xNum, xMax, yMin, include:[numbers], fmtY(v),
            xTick(p,i), band:{lo,hi,label}, ref:{y,label}, barW, height, aria,
            table:{head:[...], rows:[[...]]}, legend:[{label,color}] }                          */
function drawChart(el, spec) {
  el._spec = spec;
  const prevOpen = !!(el.querySelector('details') && el.querySelector('details').open);
  const W = Math.max(240, el.clientWidth || 560), H = spec.height || 200;
  const m = { l: 42, r: 14, t: 14, b: 28 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const pts = spec.pts, n = pts.length;
  const fmtY = spec.fmtY || (v => String(Math.round(v)));

  let ys = pts.map(p => p.y).filter(Number.isFinite).concat(spec.include || []);
  if (!ys.length) ys = [0, 1];
  if (spec.band) ys.push(spec.band.lo, spec.band.hi);
  if (spec.ref) ys.push(spec.ref.y);
  let lo = spec.yMin != null ? spec.yMin : Math.min.apply(null, ys);
  let hi = spec.yMax != null ? spec.yMax : Math.max.apply(null, ys);
  if (hi - lo < 1e-9) { hi = lo + 1; }
  const allPos = lo >= 0;
  if (spec.yMin == null) lo -= (hi - lo) * 0.08;
  if (allPos && spec.yMin == null) lo = Math.max(lo, 0);
  if (spec.yMax == null) hi += (hi - lo) * 0.08;
  const nt = niceTicks(lo, hi, 4);
  lo = nt.lo; hi = nt.hi;
  const py = v => m.t + ih - ((v - lo) / (hi - lo)) * ih;

  let x0 = 0, x1 = 1;
  if (spec.xNum) { x0 = spec.xMin != null ? spec.xMin : Math.min.apply(null, pts.map(p => p.x)); x1 = spec.xMax != null ? spec.xMax : Math.max.apply(null, pts.map(p => p.x)); if (x1 - x0 < 1e-9) x1 = x0 + 1; }
  const px = (p, i) => {
    if (spec.xNum) return m.l + ((p.x - x0) / (x1 - x0)) * iw;
    if (spec.kind === 'bar') return m.l + (iw / n) * (i + 0.5);
    return n === 1 ? m.l + iw / 2 : m.l + (i / (n - 1)) * iw;
  };

  let s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(spec.aria || '') + '"><title>' + esc(spec.aria || '') + '</title>';
  if (spec.band) {
    const y1 = py(spec.band.hi), y2 = py(spec.band.lo);
    s += '<rect class="band" x="' + m.l + '" y="' + y1 + '" width="' + iw + '" height="' + (y2 - y1) + '"/>';
    if (spec.band.label) s += '<text class="band-l" x="' + (m.l + 6) + '" y="' + (y1 + 14) + '">' + esc(spec.band.label) + '</text>';
  }
  s += '<g class="ax">';
  nt.ticks.forEach(v => {
    const y = py(v);
    s += '<line class="grid" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (m.l - 8) + '" y="' + (y + 4) + '" text-anchor="end">' + esc(fmtY(v)) + '</text>';
  });
  s += '</g>';
  s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + py(lo) + '" y2="' + py(lo) + '" stroke="var(--line-strong)" stroke-width="1"/>';
  if (spec.ref) {
    const y = py(spec.ref.y);
    s += '<line class="ref" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y + '" y2="' + y + '"/>';
    if (spec.ref.label) s += '<text x="' + (W - m.r) + '" y="' + (y - 5) + '" text-anchor="end">' + esc(spec.ref.label) + '</text>';
  }
  // x ticks (thinned so labels never collide)
  if (spec.xTick) {
    const maxLabels = Math.max(2, Math.floor(iw / 64)), stepN = Math.max(1, Math.ceil(n / maxLabels));
    pts.forEach((p, i) => {
      if (i % stepN !== 0) return;
      const t = spec.xTick(p, i);
      if (t) s += '<text x="' + px(p, i) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(t) + '</text>';
    });
  }

  if (spec.kind === 'line') {
    const valid = pts.map((p, i) => ({ p, i })).filter(o => Number.isFinite(o.p.y));
    if (valid.length > 1) s += '<path d="' + valid.map((o, k) => (k ? 'L' : 'M') + px(o.p, o.i).toFixed(1) + ',' + py(o.p.y).toFixed(1)).join('') + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    if (n <= 24) valid.forEach(o => { s += '<circle class="mk" cx="' + px(o.p, o.i).toFixed(1) + '" cy="' + py(o.p.y).toFixed(1) + '" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>'; });
    if (valid.length && spec.endLabel !== false) {
      const L = valid[valid.length - 1], lx = Math.min(px(L.p, L.i), W - m.r - 2);
      s += '<text x="' + lx + '" y="' + Math.max(m.t + 8, py(L.p.y) - 10) + '" text-anchor="end" style="fill:var(--ink);font-weight:600">' + esc(fmtY(L.p.y)) + '</text>';
    }
    s += '<line id="xh" x1="0" x2="0" y1="' + m.t + '" y2="' + py(lo) + '" stroke="var(--line-strong)" stroke-width="1" style="display:none"/>';
    s += '<circle id="xd" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" style="display:none"/>';
    s += '<rect class="hit hov" x="' + m.l + '" y="' + m.t + '" width="' + iw + '" height="' + ih + '"/>';
  } else {
    const step = spec.xNum ? iw : iw / n;
    const bw = spec.barW || Math.max(4, Math.min(24, step * 0.6));
    pts.forEach((p, i) => {
      const cx = px(p, i), v = Number.isFinite(p.y) ? p.y : 0, base = py(Math.max(lo, 0)), y = py(v), h = base - y;
      if (h > 0.5) {
        const r = Math.min(4, bw / 2, h), xl = cx - bw / 2, xr = cx + bw / 2;
        s += '<path class="mk" d="M' + xl.toFixed(1) + ',' + base.toFixed(1) + 'V' + (y + r).toFixed(1) + 'Q' + xl.toFixed(1) + ',' + y.toFixed(1) + ' ' + (xl + r).toFixed(1) + ',' + y.toFixed(1) + 'H' + (xr - r).toFixed(1) + 'Q' + xr.toFixed(1) + ',' + y.toFixed(1) + ' ' + xr.toFixed(1) + ',' + (y + r).toFixed(1) + 'V' + base.toFixed(1) + 'Z" fill="' + (p.color || 'var(--accent)') + '"/>';
      }
      const hw = Math.max(bw + 8, 16);
      s += '<rect class="hit hb" data-i="' + i + '" x="' + (cx - hw / 2).toFixed(1) + '" y="' + m.t + '" width="' + hw + '" height="' + ih + '"/>';
    });
  }
  s += '</svg>';

  if (spec.legend && spec.legend.length >= 2) s += '<div class="clegend">' + spec.legend.map(l => '<span><i class="sw" style="background:' + l.color + '"></i>' + esc(l.label) + '</span>').join('') + '</div>';
  if (spec.table) {
    s += '<details' + (prevOpen ? ' open' : '') + '><summary>' + esc(T('chart.table')) + '</summary><table><thead><tr>' + spec.table.head.map(h => '<th scope="col">' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' +
      spec.table.rows.map(r => '<tr>' + r.map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></details>';
  }
  el.innerHTML = s;

  // ---- hover layer ----
  const svg = $('svg', el);
  const toX = e => { const r = svg.getBoundingClientRect(); return (e.clientX - r.left) * (W / (r.width || W)); };
  if (spec.kind === 'line') {
    const hov = $('.hov', el), xh = $('#xh', el), xd = $('#xd', el);
    const move = e => {
      const x = toX(e);
      let best = -1, bd = 1e9;
      pts.forEach((p, i) => { if (!Number.isFinite(p.y)) return; const d = Math.abs(px(p, i) - x); if (d < bd) { bd = d; best = i; } });
      if (best < 0) return;
      const p = pts[best], cx = px(p, best);
      xh.setAttribute('x1', cx); xh.setAttribute('x2', cx); xh.style.display = '';
      xd.setAttribute('cx', cx); xd.setAttribute('cy', py(p.y)); xd.style.display = '';
      showTip(p.tip || fmtY(p.y), e.clientX, e.clientY);
    };
    const leave = () => { xh.style.display = 'none'; xd.style.display = 'none'; hideTip(); };
    hov.addEventListener('pointermove', move);
    hov.addEventListener('pointerdown', move);
    hov.addEventListener('pointerleave', leave);
  } else {
    $$('.hb', el).forEach(r => {
      const i = +r.getAttribute('data-i');
      const on = e => showTip(pts[i].tip || fmtY(pts[i].y), e.clientX, e.clientY);
      r.addEventListener('pointermove', on);
      r.addEventListener('pointerdown', on);
      r.addEventListener('pointerleave', hideTip);
    });
  }
}

const chartWatch = (typeof ResizeObserver === 'function') ? new ResizeObserver(entries => {

}) : null;

}

function deltaPill(pd, signed) {

  const d = pd.d;
  if (Math.abs(d) < 0.5) return '<span class="pill">' + IC.flat + esc(T('home.deltaFlat')) + '</span>';
  if (d > 0) return '<span class="pill ok">' + IC.up + esc(signed === false ? T('report.deltaUp', { d: d.toFixed(1) }) : T('home.deltaUp', { d: '+' + d.toFixed(1) })) + '</span>';
  return '<span class="pill warn">' + IC.down + esc(signed === false ? T('report.deltaDown', { d: minus(d.toFixed(1)) }) : T('home.deltaDown', { d: minus(d.toFixed(1)) })) + '</span>';
}
function dayCounts() {
  const days = [], today = new Date(); today.setHours(0, 0, 0, 0);
  for (let i = 13; i >= 0; i--) { const d = new Date(today); d.setDate(d.getDate() - i); days.push({ d, min: 0, key: d.toDateString() }); }
  S.sessions.forEach(s => { const k = new Date(s.ts).toDateString(), row = days.find(x => x.key === k); if (row) row.min += s.dur / 60; });
  const set = new Set(days.filter(x => x.min > 0).map(x => x.key));
  let streak = 0, i = days.length - 1;
  if (!set.has(days[i].key)) i--;
  while (i >= 0 && set.has(days[i].key)) { streak++; i--; }
  return { days, practised: set.size, streak };
}

function generateScript(req, again) {

  const ai = addBubble('ai', '<div class="skel" style="width:92%"></div><div class="skel" style="width:78%"></div><div class="skel" style="width:60%"></div><p class="note" role="status"></p>');
  const status = $('.note', ai);
  status.textContent = req.file ? T('script.extracting') : (again ? T('script.regenerating') : T('script.generating'));
  const feed = $('#chatFeed'); feed.scrollTop = feed.scrollHeight;
  setTimeout(() => { if (req.file) status.textContent = T('script.generating'); }, 900);
  setTimeout(() => {
    const pool = SCRIPTS[req.topic], text = pool[S.scriptN++ % pool.length];
    const sents = tokenize(text).sentences, mid = Math.ceil(sents.length / 2);
    const paras = [sents.slice(0, mid).join(' '), sents.slice(mid).join(' ')];
    const title = titleFrom(req.txt, req.file, req.topic);
    let h = '<div class="row between" style="margin-bottom:8px"><strong style="font:600 14px var(--sans)"></strong><span class="badge-demo">' + esc(T('demo.badge')) + '</span></div>';
    paras.forEach((p, i) => {
      h += '<div class="para"><span class="ptxt"></span>' + (req.file ? (i === 0 ? '<span class="cite">' + esc(T('script.page', { n: 2 })) + '</span>' : '<span class="cite un">' + esc(T('script.uncited')) + '</span>') : '') + '</div>';
    });
    h += req.file ? '<p class="note" style="margin-top:10px">' + esc(T('script.uncitedHelp')) + '</p>' : '<p class="note" style="margin-top:10px">' + esc(T('script.citeNone')) + '</p>';
    h += '<div class="acts"><button class="btn btn-primary btn-sm" type="button" data-a="practice"></button><button class="btn btn-sm" type="button" data-a="copy"></button><button class="btn btn-sm" type="button" data-a="download"></button><button class="btn btn-sm" type="button" data-a="again"></button></div>';
    ai.innerHTML = '<div class="who">' + IC.ai + '<span>' + esc(T('script.assistant')) + '</span></div>' + h;
    $('strong', ai).textContent = T('script.scriptHeader', { title });
    $$('.ptxt', ai).forEach((el, i) => { el.textContent = paras[i]; });
    $('[data-a=practice]', ai).textContent = T('script.practice'); $('[data-a=copy]', ai).textContent = T('script.copy');
    $('[data-a=download]', ai).textContent = T('script.download'); $('[data-a=again]', ai).textContent = T('script.regenerate');
    ai._script = { title, text, topic: req.topic, req };
    S.chatBusy = false; $('#chatSend').disabled = false;
    feed.scrollTop = feed.scrollHeight;
  }, req.file ? 1900 : 1300);
}
function sendChat() {
  if (S.chatBusy) return;
  const txt = $('#chatIn').value.trim(), err = $('#chatErr');
  if (!txt && !S.chatFile) return;
  if (wordsOf(txt) > 3000) { showErr(err, T('script.errLong')); return; }
  clearErr(err);
  if (BANNED.some(b => new RegExp('\\b' + b + '\\b', 'i').test(txt))) { openModal('mSafety'); return; }
  const req = { txt, file: S.chatFile, topic: $('#chatTopic').value };
  const me = addBubble('me', '<span></span>');
  me.firstChild.textContent = [txt, S.chatFile ? '📎 ' + S.chatFile.name : ''].filter(Boolean).join('\n');
  $('#chatIn').value = ''; S.chatFile = null; renderChatFile();
  S.lastReq = req;
  generateScript(req, false);
}
function onChatAction(e) {
  const b = e.target.closest('[data-a]');
  if (!b) return;
  const sc = b.closest('.bubble')._script;
  if (!sc) return;
  const a = b.getAttribute('data-a');
  if (a === 'practice') {
    S.texts.mine = { title: T('practice.fromScript', { title: sc.title }), short: sc.title, text: sc.text, topic: sc.topic };
    S.src = 'mine'; go('practice');
  } else if (a === 'copy') {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(sc.text).then(() => toast(T('script.copied')), () => toast(T('script.copyFail'), true));
    else toast(T('script.copyFail'), true);
  } else if (a === 'download') {
    const url = URL.createObjectURL(new Blob([sc.text], { type: 'text/plain' })), a2 = document.createElement('a');
    a2.href = url; a2.download = T('script.downloadName'); document.body.appendChild(a2); a2.click(); a2.remove(); setTimeout(() => URL.revokeObjectURL(url), 500);
  } else if (a === 'again') {
    if (!S.chatBusy) generateScript(sc.req, true);
  }
}

/* ---------- recorder helper (SIM: no microphone is opened in this prototype) ---------- */
function levelAnim(lvlEl) {
  const bars = $$('i', lvlEl);
  lvlEl.classList.add('live');
  const iv = setInterval(() => bars.forEach((b, k) => { b.style.height = (4 + Math.random() * 30 * (0.4 + 0.6 * Math.sin((k + 1) / 13 * Math.PI))) + 'px'; }), 110);
  return () => { clearInterval(iv); lvlEl.classList.remove('live'); bars.forEach(b => { b.style.height = ''; }); };
}
function startRecorder(o) {
  const t0 = Date.now(), stopLvl = levelAnim(o.lvl);
  const r = {
    stop(auto) {
      if (r.done) return; r.done = true;
      clearInterval(r.iv); stopLvl();
      o.onEnd(Math.round((Date.now() - t0) / 100) / 10, !!auto);
    }
  };
  r.iv = setInterval(() => { const s = (Date.now() - t0) / 1000; o.onTick(s); if (o.max && s >= o.max) r.stop(true); }, 200);
  return r;
}
function requireConsent(cb) {
  if (S.consent) { cb(); return; }
  S.afterConsent = cb; openModal('mConsent');
}

/* ---- evaluation (SIM). Real app: POST audio -> FastAPI -> STT fallback router -> VAD/Parselmouth -> score() ---- */
function runEval() {
  const scn = $('#demoScenario').value, txt = S.texts[S.src];
  if (!txt || !S.audio) return;
  S.ev = { timers: [] };
  const later = (fn, ms) => { S.ev.timers.push(setTimeout(fn, ms)); };
  const steps = [];
  if (scn === 'queue') for (let n = 3; n >= 1; n--) steps.push({ step: T('eval.queue'), text: T('eval.queueText', { n }), ms: 900 });
  steps.push({ step: T('eval.step1'), text: T('eval.step1Text'), ms: 800 });
  steps.push({ step: T('eval.step2'), text: T('eval.step2Text'), ms: 1600 });
  const run = i => {
    if (!S.ev) return;
    if (i >= steps.length) { finishEval(scn, txt); return; }
    $('#ovStep').textContent = steps[i].step; $('#ovText').textContent = steps[i].text;
    later(() => run(i + 1), steps[i].ms);
  };
  openModal('mOverlay', { lock: true, focus: '#ovCancel' });
  run(0);
}
function cancelEval() {
  if (S.ev) { S.ev.timers.forEach(clearTimeout); S.ev = null; }
  closeModal('mOverlay');
}
function finishEval(scn, txt) {
  S.ev = null;
  closeModal('mOverlay', false);
  if (scn === 'error') { openModal('mError', { focus: '#meRetry' }); return; }
  const seed = (hashStr(txt.text) ^ (Date.now() & 0xffff)) >>> 0;
  const an = simulate(txt.text, LEVEL_NOW, seed);
  if (scn === 'quiet') an.voicedRatio = 0.12;
  const sc = score(an);
  const ses = { id: S.nextId++, ts: Date.now(), title: txt.short, topicKey: txt.topic, an, sc, dur: an.dur, accent: S.profile ? S.profile.accent : null, demo: false };
  S.audio = null;
  if (sc.status !== 'ok') { S.cur = ses; go('report'); return; }
  S.sessions.push(ses); S.cur = ses;
  go('report');
  toast(T('eval.saved'));
}

function wordHtml(w) {

  let h = cls ? '<button type="button" class="w ' + cls + '" data-i="' + w.i + '">' + esc(w.raw) + '</button>' : '<span class="w" data-i="' + w.i + '">' + esc(w.raw) + '</span>';
  if (w.fillerAfter) h += ' <span class="fillerchip">' + ['um', 'uh', 'er'][w.i % 3] + '</span>';
  if (w.pauseAfter && w.pauseAfter.kind !== 'natural') {
    const forgot = w.pauseAfter.kind === 'forgot', d = w.pauseAfter.dur.toFixed(1);
    h += ' <span class="pausechip ' + (forgot ? 'bad' : 'warn') + '" role="img" aria-label="' + esc(T(forgot ? 'report.pauseForgot' : 'report.pauseHes')) + ', ' + d + ' s">' + d + ' s</span>';

function buildTranscript(an) {

function startPlayback() {
  const s = S.cur; if (!s) return;
  if (S.play.t >= s.an.dur) S.play.t = 0;
  S.play.on = true;
  S.play.iv = setInterval(() => {
    S.play.t += 0.1;
    if (S.play.t >= s.an.dur) { S.play.t = s.an.dur; stopPlayback(); }
    updatePlayer();
  }, 100);
  updatePlayer();
}
function seekTo(t, play) { stopPlayback(); S.play.t = Math.max(0, t); if (play) startPlayback(); else updatePlayer(); }
function onTxClick(e) {
  const tb = e.target.closest('.tx-time'), wb = e.target.closest('button.w');
  if (tb) { seekTo(parseFloat(tb.getAttribute('data-t0')), true); return; }
  if (!wb) return;
  const w = S.cur.an.words[+wb.getAttribute('data-i')], word = plain(w.raw);
  $('#wordDetail').textContent = T({ wrong: 'report.dWrong', near: 'report.dNear', missing: 'report.dMissing' }[w.status], { w: word });
  let t = w.start;
  if (t == null) { const prev = S.cur.an.words.slice(0, w.i).reverse().find(x => x.end != null); t = prev ? prev.end : 0; }
  seekTo(Math.max(0, t - 0.2), w.status !== 'missing');
}

/* ---------- History ---------- */
RENDER.history = function () {
  const ss = scored(), empty = !ss.length;
  $('#histEmpty').hidden = !empty; $('#histData').hidden = empty; $('#delAll').hidden = empty;
  if (empty) {
    $('#histEmpty').innerHTML = '<h2>' + esc(T('history.emptyT')) + '</h2><p class="note">' + esc(T('history.emptyD')) + '</p><button class="btn btn-primary" type="button" data-go="practice">' + esc(T('history.emptyCta')) + '</button>';
    return;
  }
  chart('#chHist', lineSpec(ss, s => s.sc.overall, { aria: T('history.cScore'), col: T('history.colScore'), yMax: 100 }));
  $('#histBody').innerHTML = ss.slice().reverse().map(s => {
    const lab = fmtDay(s.ts) + ', ' + s.title;
    return '<tr><td>' + esc(fmtDayLong(s.ts)) + '</td><td>' + esc(s.title) + '</td><td class="num">' + fmtTime(s.dur) + '</td><td class="num">' + (s.sc.overall != null ? Math.round(s.sc.overall) : esc(T('common.na'))) + '</td><td><div class="row" style="flex-wrap:nowrap;justify-content:flex-end"><button class="btn btn-ghost btn-sm" type="button" data-open="' + s.id + '" aria-label="' + esc(T('history.open') + ': ' + lab) + '">' + esc(T('history.open')) + '</button><button class="btn btn-danger-ghost btn-sm" type="button" data-del="' + s.id + '" aria-label="' + esc(T('history.delete') + ': ' + lab) + '">' + esc(T('history.delete')) + '</button></div></td></tr>';
  }).join('');
};
function openReport(id) { const s = S.sessions.find(x => x.id === id); if (s) { S.cur = s; go('report'); } }

/* ---------- Profile ---------- */
RENDER.profile = function () {
  paintAvatar($('#avBig')); $('#avRemove').disabled = !S.avatar;
  const p = S.profile || {}, ns = T('profile.rowNotSet');
  const rows = [
    [T('profile.rowName'), S.user.name], [T('profile.rowGender'), p.gender || ns], [T('profile.rowAge'), p.age != null ? p.age : ns],
    [T('profile.rowAccent'), p.accent || ns], [T('profile.rowTopics'), p.topics && p.topics.length ? p.topics.map(k => TOPICS[k]).join(', ') : ns]
  ];
  $('#pfSummary').innerHTML = rows.map(r => '<tr><th scope="row">' + esc(r[0]) + '</th><td>' + esc(r[1]) + '</td></tr>').join('');
  renderBaseline();
};
function renderBaseline(sec, msg) {
  const rec = !!S.brec, s = sec || 0;
  $('#blTimer').textContent = fmtTime(s) + T('profile.timerSuffix', { t: fmtTime(BASELINE_SECONDS) });
  const pct = Math.min(100, Math.round(s / BASELINE_SECONDS * 100));
  $('#blBar').style.width = pct + '%'; $('#blBarWrap').setAttribute('aria-valuenow', String(pct));
  $('#blStart').innerHTML = rec ? '<span class="rec-dot" aria-hidden="true"></span>' + esc(T('profile.stop')) : esc(T(S.baseline ? 'profile.again' : 'profile.start'));
  const st = $('#blStatus');
  if (rec) { st.className = 'pill'; st.textContent = T('profile.recording'); }
  else if (msg) { st.className = 'pill warn'; st.textContent = msg; }
  else if (S.baseline) { st.className = 'pill ok'; st.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg><span></span>'; $('span', st).textContent = T('profile.saved', { date: fmtDayLong(S.baseline.ts) }); }
  else { st.className = 'pill'; st.textContent = T('profile.none'); }
}
function toggleBaseline() {
  if (S.brec) { S.brec.stop(false); return; }
  requireConsent(() => {
    S.brec = startRecorder({
      lvl: $('#blLvl'), max: BASELINE_SECONDS, onTick: s => renderBaseline(s),
      onEnd: sec => {
        S.brec = null;
        const min = Math.min(10, BASELINE_SECONDS);
        if (sec < min) { renderBaseline(0, T('profile.tooShort', { n: min })); return; }
        S.baseline = { ts: Date.now() }; renderBaseline(sec); toast(T('profile.toastSaved'));
      }
    });
    renderBaseline(0);
  });
}

/* ---------- profile modal ---------- */
function openProfileModal(first) {
  S.pmFirst = first;
  const p = S.profile || (first && PREFILL_ONBOARDING ? PREFILL : {});
  $('#mpTitle').textContent = T(first ? 'pm.titleFirst' : 'pm.titleEdit');
  $('#mpSub').textContent = T(first ? 'pm.subFirst' : 'pm.subEdit');
  $('#mpCancel').hidden = first;
  $('#mpGender').innerHTML = '<option value="">' + esc(T('pm.genderPh')) + '</option>' + T('pm.genders').map(g => '<option value="' + esc(g) + '">' + esc(g) + '</option>').join('');
  $('#mpGender').value = p.gender || '';
  $('#mpAge').value = p.age != null ? p.age : '';
  $('#mpAccents').innerHTML = T('pm.accents').map(a => '<label><input type="radio" name="pmAccent" value="' + esc(a) + '"' + (p.accent === a ? ' checked' : '') + '> ' + esc(a) + '</label>').join('');
  $('#mpTopics').innerHTML = Object.keys(TOPICS).map(k => '<label><input type="checkbox" name="pmTopic" value="' + k + '"' + (p.topics && p.topics.indexOf(k) >= 0 ? ' checked' : '') + '> ' + esc(TOPICS[k]) + '</label>').join('');
  ['eAge', 'eAccent', 'eTopics'].forEach(i => $('#' + i).classList.remove('show'));
  $('#mpAge').removeAttribute('aria-invalid');
  openModal('mProfile', { lock: first, focus: first ? '#mpGender' : undefined });
}
function saveProfileModal() {
  const age = $('#mpAge').value.trim(), acc = $('input[name=pmAccent]:checked'), tops = $$('input[name=pmTopic]:checked').map(i => i.value);
  const n = age === '' ? null : Number(age);
  const okAge = n === null || (Number.isInteger(n) && n >= 1 && n <= 120);
  $('#eAge').classList.toggle('show', !okAge); $('#mpAge').setAttribute('aria-invalid', String(!okAge));
  $('#eAccent').classList.toggle('show', !acc); $('#eTopics').classList.toggle('show', !tops.length);
  if (!okAge) { $('#mpAge').focus(); return; }
  if (!acc) { $('input[name=pmAccent]').focus(); return; }
  if (!tops.length) { $('input[name=pmTopic]').focus(); return; }
  S.profile = { gender: $('#mpGender').value || null, age: n, accent: acc.value, topics: tops };
  closeModal('mProfile'); toast(T('pm.saved')); fillTopicSelect();
  if (RENDER[S.screen]) RENDER[S.screen]();
}

/* ---------- other modals ---------- */
function openPassModal() {
  $('#mpUser').value = S.user.name; $('#mpNew').value = ''; $('#mpNew2').value = ''; clearErr($('#mpErr'));
  openModal('mPass');
}
function savePass() {
  const u = $('#mpUser').value.trim(), a = $('#mpNew').value, b = $('#mpNew2').value, err = $('#mpErr');
  if (!u || !a || !b) { showErr(err, T('pass.errEmpty')); return; }
  if (a !== b) { showErr(err, T('pass.errMismatch')); $('#mpNew2').focus(); return; }
  S.user.name = u; renderAccount(); closeModal('mPass'); toast(T('pass.ok'));
  if (RENDER[S.screen]) RENDER[S.screen]();
}
let audioTestStop = null;
function openAudioModal() {
  $('#auMic').innerHTML = T('audio.mics').map((m, i) => '<option value="' + i + '">' + esc(m) + '</option>').join('');
  $('#auTestNote').textContent = '';
  openModal('mAudio');
}
function testMic() {
  if (audioTestStop) return;
  $('#auTestNote').textContent = T('audio.testing');
  audioTestStop = levelAnim($('#auLvl'));
  setTimeout(() => { if (audioTestStop) { audioTestStop(); audioTestStop = null; $('#auTestNote').textContent = T('audio.testOk'); } }, 1800);
}

/* ---------- init / events ---------- */
function init() {
  applyText();
  document.title = T('app.name');
  $$('.mbg .box').forEach(b => { b.tabIndex = -1; });
  $('#chatTopic').innerHTML = Object.keys(TOPICS).map(k => '<option value="' + k + '">' + esc(TOPICS[k]) + '</option>').join('');

  // generic delegated clicks
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]');
    if (g) { closeUserMenu(); go(g.getAttribute('data-go')); return; }
    if (e.target.closest('[data-back]')) { go(S.from || 'home'); return; }
    const o = e.target.closest('[data-open]'); if (o) { openReport(+o.getAttribute('data-open')); return; }
    const d = e.target.closest('[data-del]');
    if (d) {
      const id = +d.getAttribute('data-del');
      confirmBox(T('history.delT'), T('history.delD'), T('history.delOk'), () => { S.sessions = S.sessions.filter(x => x.id !== id); if (S.cur && S.cur.id === id) S.cur = null; RENDER.history(); toast(T('history.deleted')); focusHeading(); });
      return;
    }
    const c = e.target.closest('[data-close]'); if (c) { const m = c.closest('.mbg'); if (m) closeModal(m.id); return; }
    if (e.target.classList && e.target.classList.contains('mbg')) { const id = e.target.id; if (!e.target._lock && id !== 'mOverlay' && !(S.pmFirst && id === 'mProfile')) closeModal(id); return; }
    if (!e.target.closest('#acct')) closeUserMenu();
  });
  // keyboard: Esc, focus trap, menu arrows, tab arrows
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      const top = S.modal[S.modal.length - 1];
      if (top) { e.preventDefault(); if (top === 'mOverlay') cancelEval(); else if (!(S.pmFirst && top === 'mProfile')) closeModal(top); return; }
      if (!$('#userMenu').hidden) { closeUserMenu(true); return; }
    }
    if (e.key === 'Tab' && S.modal.length) {
      const m = $('#' + S.modal[S.modal.length - 1]), f = $$(FOCUSABLE, m).filter(usable);
      if (!f.length) { e.preventDefault(); return; }
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && (document.activeElement === first || document.activeElement === m.firstElementChild)) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      else if (!m.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    }
    const menu = $('#userMenu');
    if (!menu.hidden && menu.contains(document.activeElement)) {
      const items = $$('[role=menuitem]', menu), i = items.indexOf(document.activeElement);
      if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
      else if (e.key === 'Tab') closeUserMenu();
    }
    const tab = e.target.closest && e.target.closest('.seg [role=tab]');
    if (tab && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const tabs = $$('[role=tab]', tab.parentElement), i = tabs.indexOf(tab), nx = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
      nx.focus(); nx.click();
    }
  });

  // header / landing / auth
  $('#brandBtn').onclick = () => { if (S.user) go('home'); else { showView('landing'); window.scrollTo(0, 0); } };
  $('#hLogin').onclick = $('#lLogin').onclick = () => openAuth('in');
  $('#hSignup').onclick = $('#lCta').onclick = () => openAuth('up');
  $('#authBack').onclick = () => { showView('landing'); window.scrollTo(0, 0); };
  $('#aTabIn').onclick = () => setAuthMode('in'); $('#aTabUp').onclick = () => setAuthMode('up');
  $('#authForm').addEventListener('submit', onAuthSubmit);
  $('#pwToggle').onclick = () => { const p = $('#auPass'), show = p.type === 'password'; p.type = show ? 'text' : 'password'; $('#pwToggle').textContent = T(show ? 'auth.hide' : 'auth.show'); $('#pwToggle').setAttribute('aria-pressed', String(show)); };
  $('#userBtn').onclick = toggleUserMenu;
  $('#userMenu').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const a = b.getAttribute('data-act'); closeUserMenu(true);
    if (a === 'profile') go('profile');
    else if (a === 'audio') openAudioModal();
    else if (a === 'perm') { $('#pmChk').checked = S.consent; openModal('mPerm'); }
    else if (a === 'pass') openPassModal();
    else if (a === 'logout') logout();
  });

  // script
  $('#attachBtn').onclick = () => $('#chatFileIn').click();
  $('#chatFileIn').onchange = e => {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    const okType = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
    if (!okType || f.size > 25 * 1024 * 1024) { showErr($('#chatErr'), T('script.errFile')); return; }
    clearErr($('#chatErr')); S.chatFile = { name: f.name, size: f.size }; renderChatFile();
  };
  $('#chatFile').addEventListener('click', e => { if (e.target.closest('#chatFileX')) { S.chatFile = null; renderChatFile(); $('#attachBtn').focus(); } });
  $('#chatSend').onclick = sendChat;
  $('#chatIn').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendChat(); } });
  $('#chatFeed').addEventListener('click', onChatAction);

  // practice
  $$('[data-src]').forEach(b => { b.onclick = () => setSrc(b.getAttribute('data-src')); });
  $('#goScript').onclick = () => go('script');
  $('#sampleBtn').onclick = pickSample;
  $('#ownText').addEventListener('input', () => { updateOwnCount(); clearErr($('#ownErr')); $('#ownText').removeAttribute('aria-invalid'); });
  $('#ownUse').onclick = useOwn;
  $('#tabRec').onclick = () => { if (S.rec) return; S.voiceTab = 'rec'; renderPractice(); };
  $('#tabUp').onclick = () => { if (S.rec) return; S.voiceTab = 'up'; renderPractice(); };
  $('#recBtn').onclick = toggleRecording;
  $('#recClear').onclick = () => confirmBox(T('practice.discardT'), T('practice.discardD'), T('practice.discardOk'), () => { S.audio = null; renderPractice(); $('#recBtn').focus(); });
  $('#dropBtn').onclick = () => $('#fileIn').click();
  $('#fileIn').onchange = onAudioFile;
  $('#evalBtn').onclick = runEval;
  $('#ovCancel').onclick = cancelEval;
  $('#meRetry').onclick = () => { closeModal('mError', false); runEval(); };

  // report
  $('#repAgain').onclick = () => go('practice');
  $('#tx').addEventListener('click', onTxClick);
  $('#playBtn').onclick = () => { if (S.play.on) stopPlayback(); else startPlayback(); };
  $('#seek').addEventListener('input', e => seekTo(+e.target.value / 10, false));

  // history / profile
  $('#delAll').onclick = () => confirmBox(T('history.delAllT'), T('history.delAllD'), T('history.delAllOk'), () => { S.sessions = []; S.cur = null; RENDER.history(); toast(T('history.deletedAll')); focusHeading(); });
  $('#mcfOk').onclick = () => { const cb = S.confirmCb; S.confirmCb = null; closeModal('mConfirm'); if (cb) cb(); };
  $('#editInfo').onclick = () => openProfileModal(false);
  $('#avChange').onclick = () => $('#avFile').click();
  $('#avFile').onchange = e => {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    if (!(f.type || '').startsWith('image/')) { toast(T('profile.errImage'), true); return; }
    const r = new FileReader();
    r.onload = () => { S.avatar = r.result; paintAvatar($('#avTop')); RENDER.profile(); toast(T('profile.okAvatar')); };
    r.readAsDataURL(f);
  };
  $('#avRemove').onclick = () => { S.avatar = null; paintAvatar($('#avTop')); RENDER.profile(); toast(T('profile.okRemoved')); };
  $('#blStart').onclick = toggleBaseline;

  // modals
  $('#mpSave').onclick = saveProfileModal;
  $('#mpCancel').onclick = () => closeModal('mProfile');
  $('#mcAllow').onclick = () => { S.consent = true; closeModal('mConsent'); toast(T('consent.toastOn')); const cb = S.afterConsent; S.afterConsent = null; if (cb) cb(); };
  $('#mcDeny').onclick = () => { S.afterConsent = null; closeModal('mConsent'); toast(T('consent.toastDenied')); };
  $('#passSave').onclick = savePass;
  $('#auIn').addEventListener('input', e => { $('#auInV').textContent = e.target.value; });
  $('#auOut').addEventListener('input', e => { $('#auOutV').textContent = e.target.value; });
  $('#auTest').onclick = testMic;
  $('#audioSave').onclick = () => { closeModal('mAudio'); toast(T('audio.ok')); };
  $('#permSave').onclick = () => { S.consent = $('#pmChk').checked; closeModal('mPerm'); toast(T(S.consent ? 'consent.toastOn' : 'consent.toastOff')); };

  window.addEventListener('resize', syncHeader);
  window.addEventListener('scroll', syncHero, { passive: true });
  showView('landing'); renderAccount();
}
init();

</script>
</body>
</html>
