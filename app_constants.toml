# Values the team may want to tune, in one place.
# Read by src/app/constants.py at startup (restart the server after a change).
# Secrets and per-environment values (API keys, SUPABASE_*, APP_ENV) stay in .env.
# Values marked "(.env)" can also be overridden there; .env wins over this file.
#
# Fixed contracts that live in SQL and CANNOT be changed here (a new migration is needed):
#   - scripts.duration_min in (5, 10, 15, 20)
#   - schema_version of the stored evaluation result (ADR-004)

[storage]
# Number of newest sessions kept with full result, audio and charts (.env: RETENTION_FULL_SESSIONS)
retention_full_sessions = 10
# Most compact sessions (script, scores and summary only) kept per user; older ones are deleted
# (.env: MAX_COMPACT_SESSIONS)
max_compact_sessions = 30
# Lifetime of signed audio URLs, in seconds (.env: SIGNED_URL_TTL_S)
signed_url_ttl_s = 600
# Largest avatar upload, in bytes (2 MB)
avatar_max_bytes = 2_097_152
# Avatar is resized to a square of this size, in pixels
avatar_size_px = 256
# Largest avatar width or height before resizing, in pixels; larger pictures are rejected
avatar_max_side_px = 4096
# Saved scripts per user; POST /api/scripts returns 409 script_limit_reached at this count
max_saved_scripts = 10
# Longest saved script title, in characters (POST /api/scripts and PATCH /api/scripts/{id})
script_title_max_chars = 70
# Most rows one list call may return (sessions and saved scripts); must be >= max_saved_scripts
max_list_page_size = 50
# Largest uploaded audio file, in bytes (100 MB)
max_upload_bytes = 104_857_600

[audio]
# Pauses shorter than this are ignored, in seconds
min_pause_s = 0.35
# Longest practice recording accepted, in seconds (22 min)
max_audio_seconds = 1320
# Baseline recording accepted only inside [min, max], in seconds
baseline_min_seconds = 10
baseline_max_seconds = 60
# Longest ffmpeg decode before it is stopped, in seconds
decode_timeout_s = 60
# Extra seconds decoded past max_audio_seconds before the file is cut
duration_cap_margin_s = 10
# STT HTTP timeouts, in seconds: time to connect, longest wait between two reads
stt_connect_timeout_s = 5
stt_read_timeout_s = 120

[script]
# Practice script limits. 1320 s at 175 WPM is 3850 words; 4000 leaves a small margin.
# The character cap stops a few huge "words".
max_script_words = 4000
max_script_chars = 40_000
# Uploaded PDF limits: smallest and largest file in bytes (1 KB, 25 MB), most pages
min_pdf_size_bytes = 1024
max_pdf_size_bytes = 26_214_400
max_pdf_pages = 10
# Uploaded Markdown/plain-text (.md, .txt) limits: largest file in bytes (2 MB) and max words.
# Prevents oversized text documents from stalling local embeddings and Layer 2 moderation.
max_text_file_bytes = 2_097_152
max_text_file_words = 15_000
# Words the LLM writes for each template slot (min and max)
slot_fill_min_words = 80
slot_fill_max_words = 150
# Template topic suggester: max topics shown (4-5) and min cosine score for a strong match
topic_suggest_top_k = 5
topic_suggest_min_score = 0.35

[api_keys]
# How long a key that hit its quota (HTTP 429/402) is skipped before it is tried again, in seconds.
# Keys refused with 401/403 stay skipped until the server restarts.
exhausted_cooldown_s = 600

[web]
# Sent to the browser by GET /api/config. No secrets here.
# Range a user may pick from in Settings > Reading speed, in words per minute
follow_wpm_min = 60
follow_wpm_max = 240
# Slider range used until the user picks their own (min_choose < max_choose), in words per minute
follow_wpm_min_choose = 100
follow_wpm_max_choose = 180
# Slider step and default speed, in words per minute
follow_wpm_step = 5
follow_wpm_default = 145
# Auto speed (Settings > Reading speed): taps on the sentence being read set the slider.
# Share of the measured speed mixed into the current one at each tap (0..1)
follow_auto_weight = 0.4
# Taps closer than this many seconds or words apart are not measured
follow_auto_min_s = 1.5
follow_auto_min_words = 3
# A tap further ahead than this many sentences is a skip, not reading: not measured
follow_auto_max_ahead = 4
# Wait after the last slider move before saving follow_wpm, in milliseconds
follow_wpm_save_delay_ms = 800
# Max words in Practice "Own" text
own_max_words = 1500
# Length of the baseline recording, in seconds
baseline_seconds = 30
# Shortest baseline the UI accepts, in seconds
baseline_min_seconds = 10
# Speaking rate used only for "about 0:25" time hints, in words per minute
speaking_wpm_for_estimate = 145
# Seconds before the highlight reaches the first sentence while recording
follow_lead_s = 1.0
# Pause added after each sentence by the highlight, in seconds
follow_gap_s = 0.5
# Sessions per History page, and most pages loaded on Home and History
history_page_size = 20
history_max_pages = 5
# Most chat messages kept in localStorage for the Script Studio chat
chat_history_max_messages = 20
# Most words one Script Studio message may have
composer_max_words = 3000
# Script Studio text box grows up to this many lines, then scrolls inside
composer_max_lines = 5.5
# Wait between two status checks of a script being generated, in milliseconds
script_poll_interval_ms = 650
# Longest wait for one evaluation before the UI gives up, in milliseconds (2 min)
evaluate_timeout_ms = 120_000
# Wait before a running evaluation moves to the background (user goes to Home), in milliseconds
evaluate_background_after_ms = 5_000
