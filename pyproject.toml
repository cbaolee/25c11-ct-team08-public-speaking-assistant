[project]
name = "public-speaking-assistant"
version = "0.1.0"
description = "FastAPI backend service for public speaking assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
