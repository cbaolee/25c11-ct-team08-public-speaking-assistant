[project]
name = "public-speaking-assistant"
version = "0.1.0"
description = "Assistant that helps users practice and improve their public speaking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "contractions>=0.1.73",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jiwer>=4.0.0",
    "num2words>=0.5.14",
    "numpy>=2.5.4",
    "praat-parselmouth>=0.4.7",
    "pydantic-settings>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "sentence-transformers>=6.2.0",
    "silero-vad>=6.2.3",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
